<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ravenfield-like — Milestone 2</title>
<link rel="stylesheet" href="css/style.css"/>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="crosshair">
  <div class="bar bU"></div><div class="bar bD"></div>
  <div class="bar bL"></div><div class="bar bR"></div>
  <div class="dot"></div>
</div>
<div id="ammo"><span class="wname">ASSAULT RIFLE</span><br>
  <span class="mag">30</span> <span class="res">/ 120</span></div>
<div id="hint"></div>
<div id="vignette"></div>
<div id="hitmarker"><i></i><i></i><i></i><i></i></div>
<div id="fps"></div>

<div id="tickets">
  <div class="tbox eagle"><span class="flag eagleflag"></span><span id="tEagle">0</span></div>
  <div id="pips"><i>A</i><i>B</i><i>C</i><i>D</i><i>E</i></div>
  <div class="tbox raven"><span id="tRaven">0</span><span class="flag ravenflag"></span></div>
</div>
<div id="banner"></div>
<div id="killfeed"></div>
<canvas id="minimap"></canvas>
<div id="endscreen"><div class="panel">
  <h1 id="endtitle">EAGLE WINS</h1>
  <div class="sub" id="endsub"></div>
  <div class="deploy">CLICK TO RESTART &raquo;</div>
</div></div>

<div id="overlay"><div class="hint">CLICK OR PRESS ANY KEY TO TAKE CONTROL &mdash; ESC RELEASES</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
